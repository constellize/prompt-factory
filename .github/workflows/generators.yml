name: generators

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # This pin floats to the latest 26.x: Actions resolved 26.13.0 while local runs
          # were on 26.8.2. Re-verify before moving to an LTS.
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Generators are deterministic
        run: .github/scripts/check-determinism.sh
      - name: Tests pass
        run: npx jest
