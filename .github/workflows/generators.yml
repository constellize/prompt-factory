name: generators

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 26 is the major every step of this project was verified on (v26.8.2).
          # Moving to an LTS should be re-verified first.
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Generators are deterministic
        run: .github/scripts/check-determinism.sh
